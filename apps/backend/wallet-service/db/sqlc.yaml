version: "2"

sql:
  - engine: "postgresql"
    schema: "./migrations"
    queries: "./queries"

    gen:
      go:
        package: "sqlc"
        out: "../internal/sqlc"

        sql_package: "database/sql"

        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true

        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
