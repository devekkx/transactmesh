version: "3.9"

services:
  nats:
    image: nats:2.10-alpine
    container_name: transactmesh-nats

    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"

    ports:
      - "4222:4222"
      - "8222:8222"

    volumes:
      - nats-data:/data

    networks:
      - transactmesh-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: transactmesh-postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: transactmesh

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - transactmesh-network

    restart: unless-stopped

    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=128MB"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: transactmesh-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - transactmesh-network

    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  transactmesh-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nats-data:
