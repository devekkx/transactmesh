version: "3.9"

services:
  nats:
    image: nats:2.10-alpine
    container_name: transactmesh-nats
    command:
      - "--jetstream"
      - "--http_port"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - transactmesh-network

  postgres:
    image: postgres:16-alpine
    container_name: transactmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: transactmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - transactmesh-network

  redis:
    image: redis:7-alpine
    container_name: transactmesh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - transactmesh-network

networks:
  transactmesh-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nats-data:
